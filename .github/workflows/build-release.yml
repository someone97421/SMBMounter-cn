name: 构建与发布 DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 macOS 通用安装包
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: 查看构建工具版本
        run: xcodebuild -version
      - name: 构建、签名与校验 DMG
        run: bash scripts/package-dmg.sh
      - name: 上传安装包与校验文件
        uses: actions/upload-artifact@v4
        with:
          name: SMBMounter-macOS-universal
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布标签对应的 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SMBMounter-macOS-universal
          path: dist
      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.dmg dist/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.dmg dist/*.sha256 \
              --verify-tag --title "SMBMounter $RELEASE_TAG 中文版" \
              --notes-file docs/发布说明.md
          fi
